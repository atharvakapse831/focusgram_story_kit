name: focusgram_story_kit
description: "FocusGram's custom Flutter story engine: Instagram-class story editor + viewer with interactive overlays (polls, quizzes, sliders, questions, countdowns, links, mentions), per-item durations, and seen tracking."
version: 0.1.0
homepage: https://github.com/atharvakapse831/focusgram_story_kit
issue_tracker: https://github.com/atharvakapse831/focusgram_story_kit/issues

topics:
  - story
  - story-viewer
  - story-editor
  - instagram-stories
  - flutter

environment:
  # Wildcard `_` parameters (used in _buildMedia image builders) require
  # Dart 3.7+; do not lower this constraint without removing that syntax.
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  video_player: ^2.9.2

# story_editor_pro (capture/editing UI) stays a direct dependency of the host
# app. This kit focuses on the viewer, the interactive-overlay engine, and the
# data contract that binds them together.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  # No package assets are bundled. video_player uses native plugin implementations
